<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ironOrc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="magmaGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="80%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="shadowForgeOrc" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Spiked furnace body -->
  <path d="M14,56 L18,28 L32,16 L46,28 L50,56 Z" fill="url(#ironOrc)" stroke="#090d16" stroke-width="2" filter="url(#shadowForgeOrc)"/>
  
  <!-- Horn spikes on furnace -->
  <polygon points="18,28 10,16 22,22" fill="#334155" stroke="#090d16" stroke-width="1.5"/>
  <polygon points="46,28 54,16 42,22" fill="#334155" stroke="#090d16" stroke-width="1.5"/>

  <!-- Glowing fiery open maw -->
  <path d="M22,56 C22,38 42,38 42,56 Z" fill="url(#magmaGrad)" stroke="#090d16" stroke-width="2"/>
  
  <!-- Metal teeth in maw -->
  <polygon points="26,38 28,44 30,38" fill="#1e293b"/>
  <polygon points="34,38 36,44 38,38" fill="#1e293b"/>

  <!-- Heavy war hammer silhouette -->
  <g transform="rotate(30 32 20)">
    <rect x="30" y="4" width="4" height="24" fill="#ca8a04"/>
    <rect x="24" y="2" width="16" height="8" rx="1" fill="#94a3b8" stroke="#1e293b" stroke-width="1"/>
  </g>
</svg>
