<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="towerStone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadowTower" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Stone Tower Shaft (tapered) -->
  <polygon points="22,24 42,24 46,58 18,58" fill="url(#towerStone)" stroke="#0f172a" stroke-width="2" filter="url(#shadowTower)"/>

  <!-- Horizontal stone banding courses -->
  <line x1="21" y1="36" x2="43" y2="36" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="19.5" y1="48" x2="44.5" y2="48" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Arrow slit embrasure -->
  <rect x="30" y="38" width="4" height="8" rx="1" fill="#090d16" stroke="#334155" stroke-width="0.8"/>
  <rect x="30" y="27" width="4" height="6" rx="1" fill="#090d16" stroke="#334155" stroke-width="0.8"/>

  <!-- Overhanging Corbeled Parapet Platform -->
  <polygon points="16,24 48,24 46,16 18,16" fill="url(#towerStone)" stroke="#0f172a" stroke-width="2" filter="url(#shadowTower)"/>

  <!-- Battlements / Merlons -->
  <rect x="16" y="10" width="7" height="8" fill="url(#towerStone)" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="29" y="10" width="6" height="8" fill="url(#towerStone)" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="41" y="10" width="7" height="8" fill="url(#towerStone)" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Flagpole and Blue Pennant -->
  <line x1="32" y1="10" x2="32" y2="2" stroke="#d4af37" stroke-width="1.5"/>
  <polygon points="32,2 44,5 32,9" fill="#2563eb" stroke="#1d4ed8" stroke-width="1" filter="url(#shadowTower)"/>
</svg>
