<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="50%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#3e1a05"/>
    </linearGradient>
    <filter id="shadowOrc" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Wooden Defense Spikes -->
  <polygon points="12,36 8,14 16,30" fill="#78350f" stroke="#1f0e04" stroke-width="1.5"/>
  <polygon points="52,36 56,14 48,30" fill="#78350f" stroke="#1f0e04" stroke-width="1.5"/>

  <!-- Hut Mound Body -->
  <path d="M8,56 Q32,16 56,56 Z" fill="url(#hideGrad)" stroke="#1f0e04" stroke-width="2.5" filter="url(#shadowOrc)"/>

  <!-- Tusk Accents on Roof -->
  <path d="M22,28 C18,22 18,12 26,10 C24,18 24,24 22,28 Z" fill="#fef3c7" stroke="#78350f" stroke-width="1"/>
  <path d="M42,28 C46,22 46,12 38,10 C40,18 40,24 42,28 Z" fill="#fef3c7" stroke="#78350f" stroke-width="1"/>

  <!-- Hut Dark Entrance -->
  <path d="M24,56 C24,42 40,42 40,56 Z" fill="#0c0a09" stroke="#78350f" stroke-width="2"/>
  <!-- Red glowing eyes inside -->
  <circle cx="30" cy="48" r="1.5" fill="#ef4444"/>
  <circle cx="34" cy="48" r="1.5" fill="#ef4444"/>
</svg>
