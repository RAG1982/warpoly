<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bladeOrc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadowSawOrc" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Timber logs base -->
  <rect x="8" y="42" width="48" height="14" rx="4" fill="#451a03" stroke="#1f0a02" stroke-width="2" filter="url(#shadowSawOrc)"/>
  <circle cx="16" cy="49" r="2.5" fill="#78350f"/>
  <circle cx="48" cy="49" r="2.5" fill="#78350f"/>

  <!-- Jagged circular saw blade -->
  <g transform="translate(32, 28)" filter="url(#shadowSawOrc)">
    <circle cx="0" cy="0" r="18" fill="url(#bladeOrc)" stroke="#0f172a" stroke-width="2"/>
    <!-- Blade teeth -->
    <path d="M0,-22 L4,-18 L-2,-18 Z" fill="#94a3b8"/>
    <path d="M15,-15 L18,-11 L13,-12 Z" fill="#94a3b8"/>
    <path d="M22,0 L18,4 L18,-2 Z" fill="#94a3b8"/>
    <path d="M15,15 L11,18 L12,13 Z" fill="#94a3b8"/>
    <path d="M0,22 L-4,18 L2,18 Z" fill="#94a3b8"/>
    <path d="M-15,15 L-18,11 L-13,12 Z" fill="#94a3b8"/>
    <path d="M-22,0 L-18,-4 L-18,2 Z" fill="#94a3b8"/>
    <path d="M-15,-15 L-11,-18 L-12,-13 Z" fill="#94a3b8"/>
    <circle cx="0" cy="0" r="5" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <!-- Blood / Rust accent -->
  <path d="M38,36 Q42,44 40,48" stroke="#dc2626" stroke-width="2" fill="none"/>
</svg>
