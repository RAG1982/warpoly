<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="timberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="shadowHouse" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Chimney -->
  <rect x="42" y="10" width="8" height="14" fill="#64748b" stroke="#1e293b" stroke-width="1.5" filter="url(#shadowHouse)"/>
  <rect x="40" y="8" width="12" height="3" fill="#94a3b8" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Smoke puff -->
  <circle cx="46" cy="4" r="3" fill="rgba(241,245,249,0.7)"/>

  <!-- Wall Body -->
  <rect x="12" y="28" width="40" height="28" rx="2" fill="url(#wallGrad)" stroke="#451a03" stroke-width="2" filter="url(#shadowHouse)"/>

  <!-- Half-timber beams -->
  <line x1="12" y1="28" x2="52" y2="28" stroke="url(#timberGrad)" stroke-width="2.5"/>
  <line x1="32" y1="28" x2="32" y2="56" stroke="url(#timberGrad)" stroke-width="2"/>
  <line x1="12" y1="28" x2="32" y2="56" stroke="url(#timberGrad)" stroke-width="1.5"/>
  <line x1="52" y1="28" x2="32" y2="56" stroke="url(#timberGrad)" stroke-width="1.5"/>

  <!-- Door -->
  <rect x="26" y="38" width="12" height="18" rx="2" fill="#78350f" stroke="#291204" stroke-width="1.5"/>
  <circle cx="35" cy="48" r="1.2" fill="#fbbf24"/>

  <!-- Window with warm light -->
  <rect x="15" y="34" width="8" height="8" rx="1" fill="#fef08a" stroke="#78350f" stroke-width="1.5"/>
  <line x1="19" y1="34" x2="19" y2="42" stroke="#78350f" stroke-width="1"/>
  <line x1="15" y1="38" x2="23" y2="38" stroke="#78350f" stroke-width="1"/>

  <!-- Gable Roof -->
  <polygon points="32,8 58,28 6,28" fill="url(#roofGrad)" stroke="#0f172a" stroke-width="2" filter="url(#shadowHouse)"/>
  <polygon points="32,10 55,26 9,26" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="4,2"/>
</svg>
