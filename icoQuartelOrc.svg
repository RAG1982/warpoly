<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldOrc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <filter id="shadowOrcQ" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Orcish Spiked War Shield -->
  <polygon points="32,6 52,16 46,50 32,58 18,50 12,16" fill="url(#shieldOrc)" stroke="#1c1917" stroke-width="2.5" filter="url(#shadowOrcQ)"/>

  <!-- Iron Center Boss with Large Spike -->
  <circle cx="32" cy="32" r="8" fill="#44403c" stroke="#1c1917" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="3" fill="#cbd5e1"/>

  <!-- Crossed Jagged Orc Cleavers / Axes in background -->
  <g transform="rotate(-35 32 32)">
    <rect x="30" y="4" width="4" height="56" fill="#78350f" stroke="#1c1917" stroke-width="1"/>
    <path d="M34,8 C46,6 54,16 48,28 C42,22 36,20 34,22 Z" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>
  </g>
  <g transform="rotate(35 32 32)">
    <rect x="30" y="4" width="4" height="56" fill="#78350f" stroke="#1c1917" stroke-width="1"/>
    <path d="M30,8 C18,6 10,16 16,28 C22,22 28,20 30,22 Z" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>
  </g>

  <!-- Horns on shield rim -->
  <path d="M12,16 Q8,4 18,8" stroke="#fef3c7" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M52,16 Q56,4 46,8" stroke="#fef3c7" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
