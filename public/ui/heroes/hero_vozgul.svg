<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgVozgul" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#701a75"/>
      <stop offset="50%" stop-color="#4a044e"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="necroBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" fill="#0f0514" rx="16"/>
  <!-- Ritual Oval/Rune Frame -->
  <path d="M 64 12 C 94 12 112 28 112 60 C 112 92 88 114 64 114 C 40 114 16 92 16 60 C 16 28 34 12 64 12 Z"
        fill="url(#bgVozgul)" stroke="url(#necroBorder)" stroke-width="4" filter="url(#shadow)"/>
  <path d="M 64 20 C 88 20 102 34 102 60 C 102 86 82 104 64 104 C 46 104 26 86 26 60 C 26 34 40 20 64 20 Z"
        fill="none" stroke="#bef264" stroke-width="1.5" stroke-dasharray="4,4" stroke-opacity="0.5"/>
  <!-- Monogram V -->
  <text x="64" y="68" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-weight="bold" font-size="44" fill="#d8b4fe" text-anchor="middle" filter="url(#shadow)">V</text>
  <!-- Hero Name -->
  <rect x="26" y="80" width="76" height="18" rx="4" fill="#2e1065" fill-opacity="0.9" stroke="#a855f7" stroke-width="1"/>
  <text x="64" y="93" font-family="'Arial Black', sans-serif" font-weight="900" font-size="10" fill="#f5d0fe" text-anchor="middle" letter-spacing="1.5">VOZGUL</text>
</svg>
