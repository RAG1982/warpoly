<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="barracksStone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="shadowBld" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Stone Fortress Arch & Battlements -->
  <path d="M12,20 L12,12 L18,12 L18,16 L24,16 L24,12 L30,12 L30,16 L34,16 L34,12 L40,12 L40,16 L46,16 L46,12 L52,12 L52,20 L50,56 L14,56 Z" fill="url(#barracksStone)" stroke="#0f172a" stroke-width="2" filter="url(#shadowBld)"/>

  <!-- Fortress Gateway / Entrance -->
  <path d="M24,56 L24,36 Q32,28 40,36 L40,56 Z" fill="#090d16" stroke="#d4af37" stroke-width="1.5"/>
  <line x1="32" y1="31" x2="32" y2="56" stroke="#d4af37" stroke-width="1"/>
  <line x1="24" y1="44" x2="40" y2="44" stroke="#d4af37" stroke-width="1"/>

  <!-- Crossed Broadswords Crest -->
  <g transform="rotate(-40 32 30)" filter="url(#shadowBld)">
    <rect x="30" y="8" width="4" height="42" fill="url(#bladeGrad)" stroke="#1e293b" stroke-width="1"/>
    <rect x="25" y="42" width="14" height="3" rx="1" fill="#f59e0b" stroke="#78350f" stroke-width="0.8"/>
    <rect x="31" y="45" width="2" height="7" fill="#78350f"/>
    <circle cx="32" cy="53" r="2.5" fill="#f59e0b" stroke="#78350f" stroke-width="0.8"/>
  </g>
  <g transform="rotate(40 32 30)" filter="url(#shadowBld)">
    <rect x="30" y="8" width="4" height="42" fill="url(#bladeGrad)" stroke="#1e293b" stroke-width="1"/>
    <rect x="25" y="42" width="14" height="3" rx="1" fill="#f59e0b" stroke="#78350f" stroke-width="0.8"/>
    <rect x="31" y="45" width="2" height="7" fill="#78350f"/>
    <circle cx="32" cy="53" r="2.5" fill="#f59e0b" stroke="#78350f" stroke-width="0.8"/>
  </g>
</svg>
