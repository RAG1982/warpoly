<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WarPoly — Prévia de terreno e tilesets</title>
  <style>
    html, body { margin: 0; height: 100%; background: #101418; color: #e8eef4; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; }
    #panel { position: fixed; top: 12px; left: 12px; z-index: 2; background: rgba(16, 20, 24, .86); padding: 10px 12px; border-radius: 8px; max-width: 360px; }
    #panel h1 { font-size: 15px; margin: 0 0 8px; }
    #panel button, #panel select { font: inherit; padding: 5px 10px; margin: 0 6px 6px 0; border-radius: 4px; border: 1px solid #3a4652; background: #1c242c; color: inherit; cursor: pointer; }
    #panel button.on { background: #c9a13a; color: #1a1408; border-color: #c9a13a; }
    #panel small { color: #8a96a3; display: block; }
    .tag { position: fixed; z-index: 2; background: rgba(0, 0, 0, .55); padding: 2px 8px; border-radius: 4px; font-weight: 600; pointer-events: none; }
    body.hide-ui #panel { display: none; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="panel">
    <h1>Terreno e tilesets (F7-04)</h1>
    <div id="tilesets"></div>
    <div><select id="map"></select><button id="compare">Comparar os 4</button></div>
    <small>Arraste: girar · roda: zoom · botão direito: mover. Parâmetros: <code>?tileset=inverno&amp;map=ilhas-4p&amp;compare=1&amp;texq=low</code></small>
  </div>
  <div id="tags"></div>
  <script type="module" src="./src/terrainPreview.js"></script>
</body>
</html>
