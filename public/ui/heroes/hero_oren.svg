<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgOren" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="60%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="arcaneBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" fill="#090d16" rx="16"/>
  <!-- Arcane Circle Shield -->
  <circle cx="64" cy="60" r="50" fill="url(#bgOren)" stroke="url(#arcaneBorder)" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="64" cy="60" r="42" fill="none" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="6,3" stroke-opacity="0.6"/>
  <!-- Monogram O -->
  <text x="64" y="72" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-weight="bold" font-size="44" fill="#a5f3fc" text-anchor="middle" filter="url(#shadow)">O</text>
  <!-- Hero Name -->
  <rect x="28" y="84" width="72" height="18" rx="4" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1"/>
  <text x="64" y="97" font-family="'Arial Black', sans-serif" font-weight="900" font-size="10" fill="#f8fafc" text-anchor="middle" letter-spacing="1.5">OREN</text>
</svg>
