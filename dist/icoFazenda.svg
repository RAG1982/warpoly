<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="wheatGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="shadowWheat" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Wheat Stems -->
  <path d="M32,56 C32,40 32,24 32,8" stroke="#ca8a04" stroke-width="2.5" fill="none"/>
  <path d="M32,56 C28,42 22,26 14,14" stroke="#ca8a04" stroke-width="2.5" fill="none"/>
  <path d="M32,56 C36,42 42,26 50,14" stroke="#ca8a04" stroke-width="2.5" fill="none"/>

  <!-- Wheat Grains / Ears Center -->
  <g filter="url(#shadowWheat)">
    <ellipse cx="32" cy="10" rx="3.5" ry="6" fill="url(#wheatGold)" stroke="#713f12" stroke-width="1"/>
    <ellipse cx="28" cy="18" rx="3.5" ry="5.5" transform="rotate(-25 28 18)" fill="url(#wheatGold)" stroke="#713f12" stroke-width="1"/>
    <ellipse cx="36" cy="18" rx="3.5" ry="5.5" transform="rotate(25 36 18)" fill="url(#wheatGold)" stroke="#713f12" stroke-width="1"/>
    <ellipse cx="28" cy="27" rx="3.5" ry="5.5" transform="rotate(-25 28 27)" fill="url(#wheatGold)" stroke="#713f12" stroke-width="1"/>
    <ellipse cx="36" cy="27" rx="3.5" ry="5.5" transform="rotate(25 36 27)" fill="url(#wheatGold)" stroke="#713f12" stroke-width="1"/>

    <!-- Left Sheaf Grains -->
    <ellipse cx="16" cy="16" rx="3" ry="5.5" transform="rotate(-40 16 16)" fill="url(#wheatGold)" stroke="#713f12" stroke-width="1"/>
    <ellipse cx="21" cy="24" rx="3" ry="5" transform="rotate(-35 21 24)" fill="url(#wheatGold)" stroke="#713f12" stroke-width="1"/>

    <!-- Right Sheaf Grains -->
    <ellipse cx="48" cy="16" rx="3" ry="5.5" transform="rotate(40 48 16)" fill="url(#wheatGold)" stroke="#713f12" stroke-width="1"/>
    <ellipse cx="43" cy="24" rx="3" ry="5" transform="rotate(35 43 24)" fill="url(#wheatGold)" stroke="#713f12" stroke-width="1"/>
  </g>

  <!-- Red Cloth Tie / Ribbon around bundle -->
  <path d="M22,38 Q32,42 42,38 Q32,35 22,38 Z" fill="#ef4444" stroke="#991b1b" stroke-width="1.5" filter="url(#shadowWheat)"/>
  <circle cx="32" cy="38" r="2.5" fill="#f87171"/>
</svg>
