<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="boarSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c0a02"/>
    </linearGradient>
    <filter id="shadowPig" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Wooden fence pen back -->
  <line x1="8" y1="46" x2="56" y2="46" stroke="#ca8a04" stroke-width="3"/>
  <line x1="8" y1="54" x2="56" y2="54" stroke="#ca8a04" stroke-width="3"/>

  <!-- Wild War Boar Head Profile -->
  <path d="M12,42 C12,28 20,16 34,16 C44,16 52,24 54,34 C56,44 48,48 44,48 L22,48 C16,48 12,46 12,42 Z" fill="url(#boarSkin)" stroke="#1c0a02" stroke-width="2" filter="url(#shadowPig)"/>

  <!-- Pointy Ear -->
  <polygon points="24,18 20,4 30,12" fill="#78350f" stroke="#1c0a02" stroke-width="1.5"/>

  <!-- Snout -->
  <ellipse cx="50" cy="38" rx="7" ry="5.5" fill="#9a3412" stroke="#431407" stroke-width="1.5"/>
  <circle cx="49" cy="38" r="1.5" fill="#1c0a02"/>
  <circle cx="53" cy="38" r="1.5" fill="#1c0a02"/>

  <!-- Curved sharp tusk -->
  <path d="M44,44 Q46,52 38,50 Q48,46 44,40 Z" fill="#fef3c7" stroke="#78350f" stroke-width="1" filter="url(#shadowPig)"/>
  <path d="M46,42 Q50,48 42,48 Q49,43 46,38 Z" fill="#fef3c7" stroke="#78350f" stroke-width="0.8"/>

  <!-- Small angry eye -->
  <ellipse cx="36" cy="26" rx="2.5" ry="1.8" fill="#ef4444"/>
  <circle cx="37" cy="26" r="0.8" fill="#fef08a"/>
</svg>
