<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="logGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="axeSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadowSaw" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Wood Logs base -->
  <!-- Bottom Log 1 -->
  <rect x="8" y="44" width="40" height="12" rx="6" fill="url(#logGrad)" stroke="#270e04" stroke-width="1.5" filter="url(#shadowSaw)"/>
  <ellipse cx="42" cy="50" rx="5" ry="5" fill="#d97706" stroke="#451a03" stroke-width="1"/>
  <circle cx="42" cy="50" r="2" fill="#78350f"/>

  <!-- Bottom Log 2 -->
  <rect x="18" y="34" width="38" height="12" rx="6" fill="url(#logGrad)" stroke="#270e04" stroke-width="1.5" filter="url(#shadowSaw)"/>
  <ellipse cx="50" cy="40" rx="5" ry="5" fill="#d97706" stroke="#451a03" stroke-width="1"/>
  <circle cx="50" cy="40" r="2" fill="#78350f"/>

  <!-- Top Stacked Log -->
  <rect x="10" y="24" width="34" height="11" rx="5.5" fill="url(#logGrad)" stroke="#270e04" stroke-width="1.5" filter="url(#shadowSaw)"/>
  <ellipse cx="38" cy="29.5" rx="5" ry="5" fill="#d97706" stroke="#451a03" stroke-width="1"/>

  <!-- Lumberjack Axe diagonal -->
  <g transform="rotate(-25 32 32)">
    <!-- Wooden haft -->
    <rect x="30" y="4" width="5" height="52" rx="2" fill="#d97706" stroke="#451a03" stroke-width="1.5" filter="url(#shadowSaw)"/>
    <!-- Steel axe blade -->
    <path d="M35,10 C46,6 56,12 58,26 C50,22 42,20 35,22 Z" fill="url(#axeSteel)" stroke="#1e293b" stroke-width="1.5"/>
    <path d="M35,14 C44,12 50,16 54,24" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
  </g>
</svg>
