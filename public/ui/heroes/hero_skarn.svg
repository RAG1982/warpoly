<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgSkarn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="60%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="crownIron" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="35%" stop-color="#b91c1c"/>
      <stop offset="70%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" fill="#180505" rx="16"/>
  <!-- Spiked Crown/Massive Iron Shield -->
  <path d="M 64 8 L 86 24 L 114 16 L 106 66 L 64 118 L 22 66 L 14 16 L 42 24 Z"
        fill="url(#bgSkarn)" stroke="url(#crownIron)" stroke-width="4" filter="url(#shadow)"/>
  <!-- Inner Line -->
  <path d="M 64 20 L 80 32 L 98 28 L 92 62 L 64 104 L 36 62 L 30 28 L 48 32 Z"
        fill="none" stroke="#f87171" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Monogram S -->
  <text x="64" y="70" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-weight="bold" font-size="44" fill="#fbbf24" text-anchor="middle" filter="url(#shadow)">S</text>
  <!-- Hero Name -->
  <rect x="26" y="82" width="76" height="18" rx="4" fill="#450a0a" fill-opacity="0.9" stroke="#ea580c" stroke-width="1"/>
  <text x="64" y="95" font-family="'Arial Black', sans-serif" font-weight="900" font-size="10" fill="#fef2f2" text-anchor="middle" letter-spacing="1.5">SKARN</text>
</svg>
