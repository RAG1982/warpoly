<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; background: transparent; overflow: hidden; }
canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c" width="48" height="48"></canvas>
<script>
function drawShield() {
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 48, 48);

  // Heater Shield shape
  ctx.beginPath();
  ctx.moveTo(8, 6);
  ctx.lineTo(40, 6);
  ctx.bezierCurveTo(41, 24, 34, 38, 24, 45);
  ctx.bezierCurveTo(14, 38, 7, 24, 8, 6);
  ctx.closePath();

  // Dark outline
  ctx.strokeStyle = '#1a1f26';
  ctx.lineWidth = 4;
  ctx.stroke();

  // Outer gold/bronze rim
  const rimGrad = ctx.createLinearGradient(8, 6, 40, 45);
  rimGrad.addColorStop(0, '#ffd700');
  rimGrad.addColorStop(0.5, '#b8860b');
  rimGrad.addColorStop(1, '#664400');
  ctx.fillStyle = rimGrad;
  ctx.fill();

  // Inner shield field (Steel & Royal Blue quartered or brushed steel)
  ctx.beginPath();
  ctx.moveTo(12, 10);
  ctx.lineTo(36, 10);
  ctx.bezierCurveTo(37, 24, 31, 35, 24, 41);
  ctx.bezierCurveTo(17, 35, 11, 24, 12, 10);
  ctx.closePath();

  const steelGrad = ctx.createLinearGradient(12, 10, 36, 41);
  steelGrad.addColorStop(0, '#e2e8f0');
  steelGrad.addColorStop(0.3, '#94a3b8');
  steelGrad.addColorStop(0.7, '#475569');
  steelGrad.addColorStop(1, '#1e293b');
  ctx.fillStyle = steelGrad;
  ctx.fill();

  // Center iron cross or steel boss
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath();
  ctx.arc(24, 22, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Center gold stud
  ctx.fillStyle = '#fbbf24';
  ctx.beginPath();
  ctx.arc(24, 22, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Rivets on shield rim
  ctx.fillStyle = '#ffffff';
  [[12, 8], [24, 8], [36, 8], [10, 18], [38, 18], [14, 30], [34, 30], [24, 42]].forEach(([rx, ry]) => {
    ctx.beginPath();
    ctx.arc(rx, ry, 1.2, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawArmor() {
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 48, 48);

  // Leather / Studded Brigandine Cuirass
  ctx.beginPath();
  ctx.moveTo(15, 6);
  ctx.lineTo(21, 10);
  ctx.lineTo(27, 10);
  ctx.lineTo(33, 6);
  ctx.lineTo(40, 14);
  ctx.lineTo(36, 20);
  ctx.lineTo(35, 42);
  ctx.lineTo(13, 42);
  ctx.lineTo(12, 20);
  ctx.lineTo(8, 14);
  ctx.closePath();

  // Dark outline
  ctx.strokeStyle = '#1a1008';
  ctx.lineWidth = 4;
  ctx.stroke();

  // Hardened leather gradient
  const lGrad = ctx.createLinearGradient(12, 6, 36, 42);
  lGrad.addColorStop(0, '#a05a2c');
  lGrad.addColorStop(0.3, '#783c18');
  lGrad.addColorStop(0.7, '#52250c');
  lGrad.addColorStop(1, '#321405');
  ctx.fillStyle = lGrad;
  ctx.fill();

  // Center vertical seam & steel buckle plates
  ctx.strokeStyle = '#220e05';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(24, 10);
  ctx.lineTo(24, 42);
  ctx.stroke();

  // Steel rivets / studs on leather
  ctx.fillStyle = '#e2e8f0';
  [
    [18, 18], [30, 18],
    [16, 26], [24, 24], [32, 26],
    [16, 34], [24, 32], [32, 34],
    [24, 40]
  ].forEach(([sx, sy]) => {
    ctx.beginPath();
    ctx.arc(sx, sy, 1.5, 0, Math.PI * 2);
    ctx.fill();
  });

  // Shoulder straps with bronze buckles
  ctx.fillStyle = '#fbbf24';
  ctx.fillRect(14, 11, 4, 3);
  ctx.fillRect(30, 11, 4, 3);
}

window.renderIcon = (type) => {
  if (type === 'shield') drawShield();
  else if (type === 'armor') drawArmor();
};
</script>
</body>
</html>
