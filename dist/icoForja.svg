<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="anvilIron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="fireGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadowForge" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Heavy Forge Anvil -->
  <path d="M10,26 L46,26 C54,26 58,22 60,18 C58,28 50,32 46,32 L40,32 L42,46 L48,50 L48,56 L16,56 L16,50 L22,46 L24,32 L16,32 C12,32 10,28 10,26 Z" fill="url(#anvilIron)" stroke="#0f172a" stroke-width="2" filter="url(#shadowForge)"/>
  <!-- Top surface highlight -->
  <line x1="12" y1="26" x2="46" y2="26" stroke="#f1f5f9" stroke-width="1.5"/>

  <!-- Glowing molten ingot on anvil -->
  <rect x="22" y="22" width="16" height="4" rx="1.5" fill="url(#fireGlow)" filter="url(#shadowForge)"/>

  <!-- Blacksmith's Hammer striking down -->
  <g transform="rotate(-30 26 14)" filter="url(#shadowForge)">
    <!-- Wooden Handle -->
    <rect x="24" y="-8" width="4" height="32" rx="1.5" fill="#b45309" stroke="#451a03" stroke-width="1"/>
    <!-- Iron Sledge Head -->
    <rect x="18" y="16" width="16" height="10" rx="1.5" fill="url(#anvilIron)" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="17" y="18" width="18" height="6" fill="#64748b"/>
  </g>

  <!-- Spark particles -->
  <circle cx="20" cy="18" r="1.5" fill="#fef08a"/>
  <circle cx="40" cy="16" r="1.5" fill="#f97316"/>
  <circle cx="36" cy="12" r="1.2" fill="#ef4444"/>
  <circle cx="24" cy="10" r="1" fill="#fef08a"/>
</svg>
